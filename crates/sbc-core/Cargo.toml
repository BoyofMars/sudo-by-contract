[package]
name = "sbc-core"
description = "Shared primitives for Sudo by Contract: OpenSSH certificate encoding and canonical action parsing."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
