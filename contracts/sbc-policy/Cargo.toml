[package]
name = "sbc-policy"
description = "Sudo by Contract policy contract: programmable, auditable, ephemeral machine authority on NEAR."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
sbc-core = { path = "../../crates/sbc-core" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = { version = "2.2" }
# tests/sandbox.rs: a local NEAR node. No build-time download (default
# features off); the sandbox binary is fetched when those tests first run.
near-workspaces = { version = "0.24", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
