[package]
name = "sbc-policy"
description = "Sudo by Contract policy contract: programmable, auditable, ephemeral machine authority on NEAR."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
sbc-core = { path = "../../crates/sbc-core" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = { version = "2.2" }
