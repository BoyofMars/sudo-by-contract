[package]
name = "sbc-policy"
description = "Sudo by Contract policy contract: programmable, auditable, ephemeral machine authority on NEAR."
version.workspace = true
edition.workspace = true
license.workspace = true
# NEP-330: the link (and commit) is embedded by cargo-near and served by the
# contract's `contract_source_metadata` view.
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible build (NEP-330): `cargo near build reproducible-wasm` in this
# pinned image gives byte-identical wasm, so anyone can check that the code
# hash deployed on-chain is exactly this source at the recorded commit.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30"
sbc-core = { path = "../../crates/sbc-core" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = { version = "2.2" }
