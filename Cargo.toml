[workspace]
resolver = "2"
members = ["crates/sbc-core", "crates/sbc-gate", "crates/sbc-wasm", "contracts/sbc-policy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BoyofMars/sudo-by-contract"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# The gate is a security boundary on enrolled hosts: keep overflow checks on.
[profile.release.package.sbc-gate]
opt-level = 3
