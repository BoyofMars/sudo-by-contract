[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The demo's "production" service. Starts degraded (stuck after deploy #1842);
; a restart fixes it — the remediation the agent asks permission for.
[program:checkout-api]
command=/usr/bin/python3 /opt/demo/checkout_api.py checkout-api 8080
autorestart=true
stdout_logfile=/var/log/supervisor/checkout-api.log
redirect_stderr=true

[program:payments-api]
command=/usr/bin/python3 /opt/demo/checkout_api.py payments-api 8081
autorestart=true
stdout_logfile=/var/log/supervisor/payments-api.log
redirect_stderr=true

; Heartbeat + revocation list (KRL) refresh every 30 s.
[program:sbc-sync]
command=/bin/sh -c 'while true; do /usr/local/sbin/sbc-gate sync || true; sleep 30; done'
autorestart=true
stdout_logfile=/var/log/supervisor/sbc-sync.log
redirect_stderr=true
