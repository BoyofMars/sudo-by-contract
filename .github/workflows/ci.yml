name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Tests (core, gate, contract)
        run: cargo test --workspace
      - name: Contract compiles to wasm
        run: cargo build -p sbc-policy --target wasm32-unknown-unknown --release
      - name: OpenSSH interop (our certificates verified by ssh-keygen)
        run: |
          d=$(mktemp -d)
          ssh-keygen -q -t ed25519 -N '' -f "$d/agent"
          cargo run -q -p sbc-core --example interop -- mint "$d/agent.pub" "$d/cert.pub" 600 1042
          ssh-keygen -L -f "$d/cert.pub"

  sandbox:
    # The policy contract on a local NEAR node (near-workspaces), next to a
    # TEST-ONLY mock of the MPC signer: real transactions from real
    # function-call keys, real cross-contract signing. See
    # contracts/sbc-policy/tests/sandbox.rs.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - name: Build both contracts to wasm (cargo-near)
        run: |
          (cd contracts/sbc-policy && cargo near build non-reproducible-wasm --no-abi)
          (cd contracts/mock-mpc-signer && cargo near build non-reproducible-wasm --no-abi)
          ls -l target/near/sbc_policy/sbc_policy.wasm target/near/mock_mpc_signer/mock_mpc_signer.wasm
      - name: Sandbox tests (local NEAR node)
        run: cargo test -p sbc-policy --test sandbox -- --ignored

  reproducible-contract:
    # NEP-330: the policy contract built in the pinned image from contracts/sbc-policy/Cargo.toml.
    # The deployed code hash on-chain is this build; anyone can rerun it and compare.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Reproducible build (pinned sourcescan/cargo-near image)
        run: cargo near build reproducible-wasm --manifest-path contracts/sbc-policy/Cargo.toml
      - name: Code hash (compare with the account's code_hash on NEAR)
        run: |
          wasm=$(find target/near -name 'sbc_policy.wasm' | head -n1)
          echo "wasm: $wasm ($(stat -c %s "$wasm") bytes)"
          sha256sum "$wasm"
          node -e '
            const h = require("crypto").createHash("sha256").update(require("fs").readFileSync(process.argv[1])).digest();
            const A = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"; let n = BigInt("0x" + h.toString("hex")), s = "";
            while (n > 0n) { s = A[Number(n % 58n)] + s; n /= 58n; } for (const b of h) { if (b) break; s = "1" + s; }
            console.log("code_hash (base58, as NEAR reports it): " + s);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Reproducible build of `sbc-policy`: code_hash **" + s + "**\n");
          ' "$wasm"
          cp "$wasm" sbc_policy.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: sbc-policy-reproducible
          path: sbc_policy.wasm

  sshd-integration:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends openssh-server openssh-client python3 procps
      - run: cargo build --release -p sbc-gate
      - name: Real sshd + sbc-gate against a mock chain
        run: bash sandbox/ci/sshd-integration.sh target/release/sbc-gate

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tsconfig.json --noEmit

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix apps/console
      - run: npm run build --prefix apps/console

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f sandbox/demo-server/Dockerfile -t sbc-demo-server .
      - run: docker build -f sandbox/node/Dockerfile -t sbc-node .
      - run: docker build -f sandbox/console/Dockerfile -t sbc-console .
